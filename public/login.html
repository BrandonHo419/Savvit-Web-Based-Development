<!DOCTYPE html>
<html lang="en">

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
    <!---===== FONTS =====--->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,100..900;1,100..900&family=Raleway:ital@0;1&family=Titillium+Web:ital,wght@0,200;0,300;0,400;0,600;0,700;0,900;1,200;1,300;1,400;1,600;1,700&display=swap"
        rel="stylesheet">
    <meta charset="UTF-8">
    <title>Log in ? Savvit</title>
    <!---===== CSS =====--->
    <link rel="stylesheet" href="/css/loginSignUp.css">

  <link rel="stylesheet" href="/stylesheets/design-system.css">
  <script src="/js/appearance.js"></script>
  <script src="/js/dialog-accessibility.js"></script>
</head>

<body>
    <main class="background">
        <div class="login">
            <form class="login-form" id="form">
                <h1 class="login-title">Login</h1>
                <p class="login-signup" id="error-message" role="status" aria-live="polite"></p>
                <div class="login-content">
                    <div class="login-box">
                        <i class="fa-solid fa-envelope login-icon"></i>

                        <div class="login-box-input">
                            <input type="email" required class="login-input" aria-describedby="error-message" placeholder=" " id="email-input" autocomplete="email">
                            <label for="email-input" class="login-label">Email</label>
                        </div>
                    </div>
                    <div class="login-box">
                        <i class="fa-solid fa-lock login-icon"></i>

                        <div class="login-box-input">
                            <input type="password" required class="login-input" aria-describedby="error-message" id="login-pass" autocomplete="current-password" placeholder=" ">
                            <label for="login-pass" class="login-label">Password</label>
                        </div>
                    </div>
                </div>

                <button type="submit" class="login-button">Continue</button>

                <p class="login-signup">
                    Don't have an account? <a href="/signup.html">Sign Up!</a>
                </p>
            </form>
        </div>
    </main>
    <!---===== JS =====--->
    <script src="./js/login.js"></script>
    <!---===== FONTAWESOME =====--->
    <script src="https://kit.fontawesome.com/b8ea624d11.js" crossorigin="anonymous"></script>
</body>

</html>
