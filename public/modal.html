<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/css/modal_styles.css">
    <link rel="stylesheet" href="/css/style.css">
    <script src="/js/modal_script.js" defer></script>

</head>

<body>
    <div class=add_pin_modal”>
        <div class=”add_pin_container”>
            <div class=”side” id=”left_side”>

                <!-- More ICON -->
                <div class="section1">
                    <!-- edit -->
                    <div class="icon_container">
                        <img src="./img/ellipsis.png" alt="edit" class="icon">
                    </div>
                </div>
                <!-- Upload IMG container -->
                <div class="section2">
                    <label for="upload_img" id="upload_img_label">
                        <div class="upload_img_container">
                            <div class="dotted_border">
                                <!-- upload -->
                                <div class="icon_container">
                                    <img src="./img/upload.png" alt="upload image" class="icon">
                                </div>
                                <div>Click to Upload</div>
                                <div>Recommendaion: Use high quality .jpg files less than 200MB</div>
                            </div>
                        </div>
                        <input type="file" name="upload_img" id="upload_img">
                    </label>
                </div>

                <div class="modal_pin">
                    <div class="pin_image">
                        <!-- <img src="" alt="pin_image"> -->
                    </div>
                </div>

                <!-- save from site -->
                <div class="section3">
                    <div class="save_from_site">

                    </div>
                </div>

            </div>

            <div class=”side” id=”right_side”>
                <div class="section1">
                    <div class="select_size">
                        <select name="pin_size" id="pin_size">
                            <option value="" disabled selected>Select</option>
                            <option value="small">small</option>
                            <option value="medium">medium</option>
                            <option value="large">large</option>
                        </select>
                        <div class="save_pin">Save</div>
                    </div>
                </div>
                <div class="section2">
                    <input placeholder="Add you title" type="text" class="new_pin_input" id="pin_title">
                    <input placeholder="Tell everyone what your Pin is about" type="text" class="new_pin_input"
                        id="pin_description">
                    <input placeholder="Add your destination link" type="text" class="new_pin_input"
                        id="pin_destination">
                </div>
            </div>
        </div>
    </div>
</body>

</html>
