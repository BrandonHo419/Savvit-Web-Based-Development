<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shared with me — Savvit</title>
  <link rel="stylesheet" href="/stylesheets/public-boards.css">
  <script type="module" src="/js/shared-boards.js"></script>
</head>
<body>
  <header><a href="/home.html">Savvit</a><nav class="nav" aria-label="Main"><a href="/home.html">Home</a><a href="/explore.html">Explore</a><a href="/public-boards.html">Public boards</a><a href="/shared-boards.html" aria-current="page">Shared with me</a><a href="/profile.html">Profile</a><a href="/logout.html">Log out</a></nav></header>
  <main>
    <h1>Shared with me</h1>
    <p>Semi-private boards whose owners have granted you viewing access. Owners manage sharing and editing. Refresh to check for access changes.</p>
    <form id="shared-board-search" role="search">
      <label for="board-query">Search board names</label>
      <input id="board-query" type="search" maxlength="100" name="q">
      <button type="submit">Search</button>
    </form>
    <button id="shared-refresh" type="button">Refresh shared boards</button>
    <p id="discovery-status" role="status" aria-live="polite"></p>
    <button id="discovery-retry" type="button" hidden>Retry</button>
    <div id="shared-board-list" aria-busy="false"></div>
    <nav aria-label="Results pages"><button id="previous-page" type="button" disabled>Previous</button><span id="page-label"></span><button id="next-page" type="button" disabled>Next</button></nav>
  </main>
</body>
</html>
